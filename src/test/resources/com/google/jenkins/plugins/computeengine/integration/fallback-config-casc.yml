jenkins:
  clouds:
    - computeEngine:
        cloudName: integration
        projectId: ${env.GOOGLE_PROJECT_ID}
        instanceCapStr: 10
        credentialsId: ${env.GOOGLE_PROJECT_ID}
        noDelayProvisioning: true
        configurations:
          - namePrefix:         integration-primary
            description:        integration-primary
            launchTimeoutSecondsStr: ''
            retentionTimeMinutesStr: ''
            mode:               EXCLUSIVE
            labelString:        integration
            numExecutorsStr:    1
            runAsUser:          jenkins
            remoteFs:           ''
            oneShot:            true
            createSnapshot:     false
            region:             "https://www.googleapis.com/compute/v1/projects/${env.GOOGLE_PROJECT_ID}/regions/us-east1"
            zone:               "https://www.googleapis.com/compute/v1/projects/${env.GOOGLE_PROJECT_ID}/zones/us-east1-b"
            template:           ''
            machineType:        "https://www.googleapis.com/compute/v1/projects/${env.GOOGLE_PROJECT_ID}/zones/us-east1-b/machineTypes/n1-standard-1"
            javaExecPath:       '/usr/bin/java'
            networkConfiguration:
              autofilled:
                network:        default
                subnetwork:     default
            networkTags:        "jenkins-agent ssh"
            networkInterfaceIpStackMode:
              singleStack:
                externalIPV4Address:    true
            useInternalAddress: false
            bootDiskSourceImageProject: ${env.GOOGLE_PROJECT_ID}
            bootDiskSourceImageName: "projects/${env.GOOGLE_PROJECT_ID}/global/images/jenkins-gce-integration-test-jre"
            bootDiskType:       "https://www.googleapis.com/compute/v1/projects/${env.GOOGLE_PROJECT_ID}/zones/us-east1-b/diskTypes/pd-ssd"
            bootDiskSizeGbStr:  20
            bootDiskAutoDelete: true
            serviceAccountEmail: "${env.GOOGLE_SA_NAME}@${env.GOOGLE_PROJECT_ID}.iam.gserviceaccount.com"
          - namePrefix:         integration-fallback
            description:        integration-fallback
            launchTimeoutSecondsStr: ''
            retentionTimeMinutesStr: ''
            mode:               EXCLUSIVE
            labelString:        integration
            numExecutorsStr:    1
            runAsUser:          jenkins
            remoteFs:           ''
            oneShot:            true
            createSnapshot:     false
            region:             "https://www.googleapis.com/compute/v1/projects/${env.GOOGLE_PROJECT_ID}/regions/us-west1"
            zone:               "https://www.googleapis.com/compute/v1/projects/${env.GOOGLE_PROJECT_ID}/zones/us-west1-a"
            template:           ''
            machineType:        "https://www.googleapis.com/compute/v1/projects/${env.GOOGLE_PROJECT_ID}/zones/us-west1-a/machineTypes/n1-standard-1"
            javaExecPath:       '/usr/bin/java'
            networkConfiguration:
              autofilled:
                network:        default
                subnetwork:     default
            networkTags:        "jenkins-agent ssh"
            networkInterfaceIpStackMode:
              singleStack:
                externalIPV4Address:    true
            useInternalAddress: false
            bootDiskSourceImageProject: ${env.GOOGLE_PROJECT_ID}
            bootDiskSourceImageName: "projects/${env.GOOGLE_PROJECT_ID}/global/images/jenkins-gce-integration-test-jre"
            bootDiskType:       "https://www.googleapis.com/compute/v1/projects/${env.GOOGLE_PROJECT_ID}/zones/us-west1-a/diskTypes/pd-ssd"
            bootDiskSizeGbStr:  20
            bootDiskAutoDelete: true
            serviceAccountEmail: "${env.GOOGLE_SA_NAME}@${env.GOOGLE_PROJECT_ID}.iam.gserviceaccount.com"
